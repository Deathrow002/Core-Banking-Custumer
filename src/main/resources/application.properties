# ================================
# Application Name and Port
# ================================
spring.application.name=customer-service
server.port=8083
spring.main.allow-bean-definition-overriding=true

# ================================
# Eureka Client Configuration
# ================================
eureka.instance.appName=CUSTOMER-SERVICE
eureka.client.fetchRegistry=true
eureka.client.healthcheck.enabled=false
eureka.instance.leaseRenewalIntervalInSeconds=10
eureka.instance.leaseExpirationDurationInSeconds=30
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka
eureka.instance.prefer-ip-address=true

# ================================
# PostgreSQL DataSource Configuration
# ================================
spring.datasource.url=jdbc:postgresql://postgres:5432/lmwn_db
spring.datasource.username=lmwn_user
spring.datasource.password=12345678

# ================================
# Hibernate JPA Configuration
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ================================
# Redis Configuration
# ================================
spring.data.redis.host=redis
spring.data.redis.port=6379
management.health.redis.enabled=false

# ================================
# Actuator Configuration
# ================================
management.endpoint.health.enabled=true
management.endpoint.info.enabled=true
management.endpoints.web.exposure.include=prometheus,health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ================================
# Docker Compose Profile Activation
# ================================
spring.profiles.active=docker-compose,dev

# ================================
# Kafka Configuration
# ================================
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=${spring.application.name}-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.ack-mode=MANUAL

# ================================
# Encryption Configuration
# ================================
encryption.secret-key=1234567890123456

# ================================
# Disable management security auto-configuration
# ================================
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
spring.main.web-application-type=servlet

# ================================
# Session Configuration (Spring Session + Redis)
# Must match every other Core Banking service.
# ================================
spring.session.data.redis.namespace=core-banking:session
spring.session.timeout=30m
# Set to true when served over HTTPS
app.session.cookie.secure=false
app.session.cookie.same-site=Lax

# Mobile bearer tokens: public issuer identity and internal signature-key endpoint.
app.oauth.issuer=${OAUTH_ISSUER:http://localhost:8080}
app.oauth.jwk-set-uri=${OAUTH_JWK_SET_URI:http://authentication-service:8084/oauth2/jwks}
app.oauth.audience=core-banking-api

# ================================
# Debug Logging Configuration
# ================================
logging.level.org.springframework.security=DEBUG